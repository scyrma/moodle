before_script:
  - if [ ! -e /cache/known_hosts ]; then ssh-keyscan -t rsa git.in.moodle.com staging.gl.moodlecloud.com > /cache/known_hosts; fi
  - if [ ! -e /cache/id_rsa ]; then s3cmd get s3://moodlecloud-ci/moodlecloud-cibot.pem /cache/id_rsa; fi
  - if [ ! -e /cache/gitconfig ]; then git config --global user.email "noreply@moodlecloud.com"; git config --global user.name "MoodleCloud Git Octopus"; cp ~/.gitconfig /cache/gitconfig; fi
  - cp /cache/id_rsa ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - cp /cache/known_hosts ~/.ssh/known_hosts
  - cp /cache/gitconfig ~/.gitconfig

variables:
  MOODLE_VERSION: "3.2"
  PUSH_REPO: "git@git.in.moodle.com:hosting/moodle.git"
  FREE_BRANCHES: "origin/CLOUD-$MOODLE_VERSION/FEATURE-bbb origin/CLOUD-$MOODLE_VERSION/FEATURE-cache origin/CLOUD-$MOODLE_VERSION/FEATURE-crontest origin/CLOUD-$MOODLE_VERSION/FEATURE-email-sender origin/CLOUD-$MOODLE_VERSION/FEATURE-moodlecloud origin/CLOUD-$MOODLE_VERSION/FEATURE-noupgrade origin/CLOUD-$MOODLE_VERSION/FEATURE-S3 origin/CLOUD-$MOODLE_VERSION/FEATURE-logging origin/CLOUD-$MOODLE_VERSION/FEATURE-user_update"
  SCHOOL_BRANCHES: "origin/CLOUD-$MOODLE_VERSION/FEATURE-bbb origin/CLOUD-$MOODLE_VERSION/FEATURE-cache origin/CLOUD-$MOODLE_VERSION/FEATURE-crontest origin/CLOUD-$MOODLE_VERSION/FEATURE-email-sender origin/CLOUD-$MOODLE_VERSION/FEATURE-moodlecloud origin/CLOUD-$MOODLE_VERSION/FEATURE-noupgrade origin/CLOUD-$MOODLE_VERSION/FEATURE-S3 origin/CLOUD-$MOODLE_VERSION/FEATURE-logging origin/CLOUD-$MOODLE_VERSION/FEATURE-user_update origin/CLOUD-$MOODLE_VERSION/FEATURE-atto_chemistry origin/CLOUD-$MOODLE_VERSION/FEATURE-atto_count origin/CLOUD-$MOODLE_VERSION/FEATURE-block_xp origin/CLOUD-$MOODLE_VERSION/FEATURE-checklist origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_attendance origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_choicegroup origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_quizgame origin/CLOUD-$MOODLE_VERSION/FEATURE-theme_school"
  TESTING_BRANCHES: "origin/CLOUD-$MOODLE_VERSION/FEATURE-bbb origin/CLOUD-$MOODLE_VERSION/FEATURE-cache origin/CLOUD-$MOODLE_VERSION/FEATURE-crontest origin/CLOUD-$MOODLE_VERSION/FEATURE-email-sender origin/CLOUD-$MOODLE_VERSION/FEATURE-moodlecloud origin/CLOUD-$MOODLE_VERSION/FEATURE-noupgrade origin/CLOUD-$MOODLE_VERSION/FEATURE-S3 origin/CLOUD-$MOODLE_VERSION/FEATURE-logging origin/CLOUD-$MOODLE_VERSION/FEATURE-user_update origin/CLOUD-$MOODLE_VERSION/FEATURE-atto_chemistry origin/CLOUD-$MOODLE_VERSION/FEATURE-atto_count origin/CLOUD-$MOODLE_VERSION/FEATURE-block_xp origin/CLOUD-$MOODLE_VERSION/FEATURE-checklist origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_attendance origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_choicegroup origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_quizgame origin/CLOUD-$MOODLE_VERSION/FEATURE-theme_school origin/CLOUD-$MOODLE_VERSION/FEATURE-wiris origin/CLOUD-$MOODLE_VERSION/FEATURE-mod_customcert"

stages:
 - build
 - deploy

merge_free:
  stage: build
  tags:
    - git-octopus
  script:
    - git remote set-url --push origin $PUSH_REPO
    - git checkout CLOUD-$MOODLE_VERSION/base
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
    - git octopus $FREE_BRANCHES origin/CLOUD-$MOODLE_VERSION/base
    - if [ -e .gitlab-ci.yml ]; then git rm .gitlab-ci.yml; git commit -m "Removing gitlab-ci.yml"; fi
    - git push --force origin +HEAD:FREE-$MOODLE_VERSION/octopus-staging
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
  allow_failure: false

merge_school:
  stage: build
  tags:
    - git-octopus
  script:
    - git remote set-url --push origin $PUSH_REPO
    - git checkout CLOUD-$MOODLE_VERSION/base
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
    - git octopus $SCHOOL_BRANCHES origin/CLOUD-$MOODLE_VERSION/base
    - if [ -e .gitlab-ci.yml ]; then git rm .gitlab-ci.yml; git commit -m "Removing gitlab-ci.yml"; fi
    - git push $PUSH_REPO +HEAD:SCHOOL-$MOODLE_VERSION/octopus-staging
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
  allow_failure: false

merge_testing_school:
  stage: build
  tags:
    - git-octopus
  script:
    - git remote set-url --push origin $PUSH_REPO
    - git checkout CLOUD-$MOODLE_VERSION/base
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
    - git octopus $TESTING_BRANCHES origin/CLOUD-$MOODLE_VERSION/base
    - if [ -e .gitlab-ci.yml ]; then git rm .gitlab-ci.yml; git commit -m "Removing gitlab-ci.yml"; fi
    - git push $PUSH_REPO +HEAD:SCHOOL-$MOODLE_VERSION/octopus-testing
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/base
  allow_failure: false

deploy_staging:
  stage: deploy
  tags:
    - git-octopus
  script:
    - ssh cibot@staging.gl.moodlecloud.com "sudo /opt/deploy_moodle_chef.sh"
