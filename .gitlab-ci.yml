merge_workplace:
  stage: build
  needs: []
  tags:
    - git-octopus
  script:
    - git remote set-url --push origin $PUSH_REPO
    - git checkout CLOUD-$MOODLE_VERSION/FEATURE-Workplace
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/FEATURE-Workplace
    - >
      if [ "$BUILD" == "workplace" ]; then
        echo "======= Merging latest workplace code ======="
        grep workplacebuild .git/config || git remote add workplacebuild git@git.in.moodle.com:workplace/workplace_moodlecloud.git
        git fetch --tags workplacebuild || ( echo "======= FAILED TO FETCH WORKPLACE BUILD"; exit 1 )
        git merge workplacebuild v${MOODLE_VERSION}+workplace || ( echo "======= FAILED TO MERGE WORKPLACE ======="; exit 1 )
        git push origin || ( echo "======= FAILED TO PUSH ======="; exit 1 )
        echo "======= Merge successfull ======="
      fi
    - export COMMON_BRANCHES=`eval "echo \\$$(echo COMMON_BRANCHES_${SHORT_VERSION})" |sed -e "s#FEATURE-#origin/CLOUD-$MOODLE_VERSION/FEATURE-#g"`
    - export WORKPLACE_BRANCHES=`eval "echo \\$$(echo WORKPLACE_BRANCHES_${SHORT_VERSION})" |sed -e "s#FEATURE-#origin/CLOUD-$MOODLE_VERSION/FEATURE-#g"`
    - git octopus $COMMON_BRANCHES $WORKPLACE_BRANCHES origin/CLOUD-$MOODLE_VERSION/FEATURE-Workplace
    - if [ -e .gitlab-ci.yml ]; then git rm .gitlab-ci.yml; git commit -m "Removing gitlab-ci.yml"; fi
    - git push --force origin +HEAD:WORKPLACE-$MOODLE_VERSION/octopus-staging
    - git reset --hard origin/CLOUD-$MOODLE_VERSION/FEATURE-Workplace
  allow_failure: false

